<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omakase Ship — Travel Japan hands-free</title>
<meta name="description" content="Figures and boxes too big for your suitcase? Drop them off in Akihabara — we pack them into one box, handle the customs form and ship it home.">
<meta name="theme-color" content="#16181d">
<style>
:root{
  --ink:#16181d; --ink2:#41454e; --mute:#7b8089;
  --paper:#f7f5f0; --card:#fff; --line:#ddd8cd;
  --navy:#1b3a5c; --red:#c8102e; --green:#1f7a4d; --amber:#fff6dd; --amber-line:#e0b93a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans SC","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

/* language bar */
.langbar{position:sticky;top:0;z-index:20;background:var(--ink);padding:calc(6px + env(safe-area-inset-top)) 0 6px}
.langs{display:flex;gap:4px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.langs button{flex:0 0 auto;padding:7px 12px;font-size:13px;font-weight:700;border:0;border-radius:2px;
  background:transparent;color:#9aa0aa;font-family:inherit;white-space:nowrap}
.langs button[aria-pressed=true]{background:var(--paper);color:var(--ink)}


.brand{margin-bottom:14px}
.brand .bmain{display:block;font-size:20px;font-weight:800;letter-spacing:.06em;color:#fff;line-height:1.1}
.brand .bsub{display:block;font-size:11px;letter-spacing:.14em;color:#8f96a3;margin-top:3px}
/* hero */
header{background:linear-gradient(rgba(8,8,12,.78),rgba(8,8,12,.52)),url('./assets/hero-akihabara.webp') center/cover no-repeat var(--ink);color:#f2efe8;padding:22px 0 30px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;
  background:repeating-linear-gradient(90deg,var(--red) 0 14px,transparent 14px 28px,#f2efe8 28px 42px,transparent 42px 56px)}
.kicker{font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--red)}
h1{font-size:36px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 10px;font-weight:800}
.lede{font-size:15.5px;color:#c3c8d0;margin:0}
.herolink{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700;color:#f2efe8;text-decoration:none;border-bottom:1px solid rgba(242,239,232,.4);padding-bottom:2px}

/* blocks */
section{margin-top:26px}
h2{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--mute);margin:0 0 12px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 17px}
.card + .card{margin-top:10px}

.step{display:flex;gap:14px;align-items:flex-start}
.step + .step{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.stepno{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step h3{font-size:16px;margin:2px 0 3px;font-weight:700}
.step p{margin:0;font-size:14.5px;color:var(--ink2)}

table{width:100%;border-collapse:collapse;font-size:14.5px}
td{padding:9px 0;border-bottom:1px solid #eeeae1;vertical-align:top}
tr:last-child td{border-bottom:0}
td.r{text-align:right;white-space:nowrap;font-weight:700}
.small{font-size:12.5px;color:var(--mute);line-height:1.6}

.warn{background:var(--amber);border:1px solid var(--amber-line);border-radius:4px;padding:15px 16px}
.warn h3{margin:0 0 7px;font-size:15.5px;color:#6b5300;font-weight:800}
.warn p{margin:0;font-size:14px;color:#6b5300}

.no{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.no span{font-size:13px;background:#fbe9e9;color:#8f1420;border:1px solid #f0c9cd;
  padding:4px 9px;border-radius:2px;font-weight:600}

/* form */
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
select,input[type=number]{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);
  border-radius:3px;background:#fcfbf8;color:var(--ink);font-family:inherit}
input[type=number]{font-family:ui-monospace,Menlo,monospace;text-align:right}
select:focus,input:focus{outline:2px solid var(--navy);outline-offset:-1px;background:#fff}
.est{margin-top:15px;background:var(--ink);color:#fff;border-radius:4px;padding:14px 15px}
.est .lbl{font-size:11px;letter-spacing:.14em;color:#9aa0aa;font-weight:700}
.est .v{font-size:27px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.est .sub{font-size:12.5px;color:#9aa0aa;margin-top:4px;line-height:1.55}
.est .duty{color:#e3e6ec;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18)}

.btn{display:block;width:100%;text-align:center;text-decoration:none;padding:15px;
  border-radius:3px;font-weight:800;font-size:16px;margin-top:9px;border:0;font-family:inherit}
.btn.line{background:#06c755;color:#fff}
.btn.wa{background:#25d366;color:#fff}
.btn.mail{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
/* 予約（Google フォーム）がいちばん目立つボタン。質問の連絡先は小さく残す。 */
.btn.book{background:var(--red);color:#fff;font-size:17px;padding:17px}
.herobook{display:block;margin-top:16px;max-width:420px}
.ask{margin-top:14px;font-size:13px;color:var(--ink2)}
.ask a{display:inline-block;margin:6px 10px 0 0;font-weight:700;color:var(--navy)}

footer{margin-top:34px;background:var(--ink);color:#8d939c;padding:22px 0 calc(26px + env(safe-area-inset-bottom));font-size:12.5px;line-height:1.7}
footer b{color:#e7e3da}
footer a.footlink{color:#aeb4bd;text-decoration:underline;text-underline-offset:2px}
[data-i18n]{}
</style>
</head>

<script>
/* ============================================================
   設定 — 料金は rates.js（window.AKIBA_RATES）に集約。ここは連絡先のみ
   ============================================================ */
var R = window.AKIBA_RATES;   // 共通料金モジュール
var CONFIG = {
  bizName:  "Omakase Ship by Play Japan",
  whatsapp: "819000000000",              // 国番号81 + 先頭0を除いた番号
  lineId:   "your-line-id",              // LINE公式アカウントID（@は除く）
  email:    "hello@example.com"
};

/* 予約フォーム（Google フォーム）。料金の目安で選んだ内容と紹介コードを入れて開く
   （usp=pp_url の事前入力）。選択肢の文字は**フォームと完全一致**（– は en ダッシュ U+2013）。 */
var FORM = {
  url: "https://docs.google.com/forms/d/e/1FAIpQLSeJqHE1Zn3QOHQhHUtQnI4l_mDOnMgi03iKkbGV1g6y1o3V2w/viewform",
  country: "entry.68402568",
  size:    "entry.314454876",
  ref:     "entry.2128966062"
};
/* 送り先：フォームに国名の選択肢がある国は国名（rates.js の COUNTRIES の form）、
   それ以外は Other。 */
var FORM_OTHER = "Other (please write below)";
function formCountryOf(code){
  var c=R.country(code);
  return (c&&c.form) ? c.form : FORM_OTHER;
}
/* 大きさ：小形包装物になるとき＝Small、EMS になるとき＝Large。
   「Several large boxes」「Not sure yet」は LP からは入れない。 */
var FORM_SIZE = {
  small: "Small \u2013 up to 2 kg and up to 90 cm (length + width + height)",
  large: "Large \u2013 one box over 90 cm or over 2 kg"
};
/* いまの選択。送り方は rates.js の route() が決める
   （梱包後 2kg 以下・90cm 以下＝小形包装物、それ以外＝EMS）。 */
function pick(){
  var c=R.country($("dest").value)||R.country("US");
  var over90=($("over90").value==="1");
  var q=R.route(c.zone, +$("wt").value, {}, { country:(c.other?null:c.code), over90:over90 });
  /* どちらの送り方にも入らない重さ（1箱 30kg 超など）は、2kg も 90cm も超える側。 */
  var small=!!(q&&q.service==="airPacket");
  return { c:c, over90:over90, q:q, small:small };
}
/* 紹介コード（tracking.js が ?s= から omakase_ref に保存したもの）。無ければ ''。 */
function refCode(){
  var re=/^[A-Z]{2}\d{2,3}$/;
  /* 先に保存済みのコード（初回の紹介元を優先・tracking.js と同じ決まり）、
     無ければ今の URL の ?s=（初めて開いた回は tracking.js がこのあとで保存するため）。 */
  try{
    var o=JSON.parse(localStorage.getItem("omakase_ref")||"null");
    var c=o&&String(o.code||"");
    if(re.test(c)) return c;
  }catch(e){}
  try{
    var s=new URLSearchParams(location.search).get("s");
    s=s?String(s):"";                       // tracking.js と同じ（そのままの形で確かめる）
    if(re.test(s)) return s;
  }catch(e){}
  return "";
}
function formUrl(){
  var pk=pick();
  var q=[["usp","pp_url"],
         [FORM.country, formCountryOf(pk.c.code)],
         [FORM.size, pk.small ? FORM_SIZE.small : FORM_SIZE.large]];
  var rc=refCode();
  if(rc) q.push([FORM.ref, rc]);
  return FORM.url+"?"+q.map(function(x){
    return encodeURIComponent(x[0])+"="+encodeURIComponent(x[1]); }).join("&");
}

var $=function(id){return document.getElementById(id);};
var lang="en";

function applyLang(L){
  lang=L;
  var t=I18N[L];
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k=el.getAttribute("data-i18n");
    if(t[k]!==undefined) el.innerHTML=t[k];
  });
  document.querySelectorAll("[data-i18n-opt]").forEach(function(el){
    var k=el.getAttribute("data-i18n-opt");
    if(t[k]!==undefined) el.textContent=t[k];
  });
  $("noList").innerHTML = t.no.map(function(x){return "<span>"+x+"</span>";}).join("");
  $("bizName").textContent = CONFIG.bizName;
  // 2つの送り方の「〜」表記（海外は米国0.5kgの最低額、国内はHOTEL_BASE）
  var fromIntl = R.handling + R.route(4,500,{},{country:"US"}).postage;
  $("priceIntl").textContent  = "¥"+fromIntl.toLocaleString()+"〜";
  $("priceHotel").textContent = "¥"+R.HOTEL_BASE.toLocaleString()+"〜";
  document.querySelectorAll("#langs button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-lang")===L);
  });
  calc();
}

document.querySelectorAll("#langs button").forEach(function(b){
  b.onclick=function(){ applyLang(b.getAttribute("data-lang")); window.scrollTo(0,0); };
});

function fill(tpl,o){
  return String(tpl||"").replace(/\{(\w+)\}/g,function(m,k){ return (o[k]!==undefined)?o[k]:m; });
}
/* 米国を選んだときだけ、合計の下に輸入の費用（Zonos の前払い）の目安を1行出す。
   合計（送料＋Service fee）には足さない。式と例は rates.js の usDuty から出す。 */
function showUsDuty(c, t){
  var el=$("usDuty"), d=R.usDuty;
  if(!c || c.code!=="US" || !d){ el.hidden=true; el.textContent=""; return; }
  var yen=function(n){ return "¥"+Math.round(n).toLocaleString(); };
  el.textContent = fill(t.us_duty||I18N.en.us_duty, {
    rate: (Math.round(d.rate*10000)/100)+"%",
    fixed: yen(d.fixed),
    exv: yen(d.example),
    ex: yen(d.example*d.rate+d.fixed)
  });
  el.hidden=false;
}
function calc(){
  var t=I18N[lang]||I18N.en;
  var pk=pick(), q=pk.q, days=+$("days").value;
  var wtSel=+$("wt").value;
  // 梱包後の重さ（1.3倍 と +200g の大きいほう）で送り方と送料を決める
  var packed = R.packedWeight(wtSel);
  var lim = R.emsLimit(pk.c.other?null:pk.c.code);
  var limTxt = { len:(lim.len/100), girth:(lim.girth/100), kg:lim.maxKg };
  var storage = Math.max(0, days-R.freeDays)*R.perDay;

  /* 大きさの注記：小形包装物になるときはその条件、EMS になるときは EMS の上限。 */
  $("sizeNote").textContent = pk.small ? (t.size_note_small||I18N.en.size_note_small)
                                       : fill(t.size_note_ems||I18N.en.size_note_ems, limTxt);
  showUsDuty(pk.c, t);
  if(!q){
    $("estVal").textContent="—";
    $("estSub").textContent = fill(t.pack_over || I18N.en.pack_over, limTxt);
    buildLinks(null, null, packed);
    return;
  }

  var total = R.handling + storage + q.postage;
  $("estVal").textContent = "¥"+total.toLocaleString();

  /* Shopify の商品・予約フォームと同じ書き方（Service fee に梱包・箱を含む）。 */
  var parts = [
    "Service fee ¥"+R.handling.toLocaleString()+" (packing, box, padding, customs form)",
    q.label+" ¥"+q.postage.toLocaleString()+" ("+packed+"g)",
    storage>0 ? "Storage ¥"+storage.toLocaleString()+" ("+(days-R.freeDays)+"d)"
              : "Storage free ("+R.freeDays+"d incl.)"
  ];
  $("estSub").textContent = parts.join("  ·  ");
  buildLinks(total, q, packed);
}


function buildLinks(total, q, packed){
  var destTxt=$("dest").options[$("dest").selectedIndex].text;
  var wtTxt=$("wt").options[$("wt").selectedIndex].text;
  var sizeTxt=($("over90").value==="1") ? "over 90 cm (L+W+H)" : "up to 90 cm (L+W+H)";
  var days=$("days").value;
  var msg = "Hello! I'd like a quote.\n"
          + "Destination: "+destTxt+"\n"
          + "Weight: "+wtTxt+"\n"
          + "Box size: "+sizeTxt+"\n"
          + "Hold for: "+days+" days\n"
          + (q ? "Estimate shown: ¥"+total.toLocaleString()+" ("+q.label+", billed at "+packed+"g)"
               : "Estimate shown: none (over the limit for one box, about "+packed+"g packed)");
  /* 紹介コード（?s= で保存したもの）も本文に入れる。 */
  var rc=refCode();
  if(rc) msg += "\nReferral code: "+rc;
  var enc=encodeURIComponent(msg);
  var fu=formUrl();
  $("btnBook").href = fu;
  $("btnBookHero").href = fu;
  $("btnWa").href  = "https://wa.me/"+CONFIG.whatsapp+"?text="+enc;
  $("btnLine").href= "https://line.me/R/ti/p/@"+CONFIG.lineId;
  $("btnMail").href= "mailto:"+CONFIG.email+"?subject="+encodeURIComponent("Shipping quote request")+"&body="+enc;
}

/* 送り先の選択肢（国ごと）。送料は地帯ごとのまま（rates.js の COUNTRIES の zone）。 */
(function(){
  $("dest").innerHTML = R.COUNTRIES.map(function(c){
    return '<option value="'+c.code+'"'+(c.code==="US"?" selected":"")+'>'+c.nameEn+'</option>';
  }).join("");
})();

["dest","wt","days","over90"].forEach(function(id){ $(id).addEventListener("change", calc); });

/* 端末の言語で初期表示を切り替え */
(function(){
  var n=(navigator.language||"en").toLowerCase();
  var pick="en";
  if(n.indexOf("zh")===0) pick = (n.indexOf("cn")>-1||n.indexOf("hans")>-1) ? "zh-Hans" : "zh-Hant";
  else if(n.indexOf("ko")===0) pick="ko";
  else if(n.indexOf("ja")===0) pick="ja";
  applyLang(pick);
})();
</script>
