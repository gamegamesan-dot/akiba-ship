<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Send It Home — Akihabara Shipping Desk</title>
<meta name="description" content="Bought too much in Akihabara? We create the customs label, hold your parcel, and ship it home for you.">
<meta name="theme-color" content="#16181d">
<style>
:root{
  --ink:#16181d; --ink2:#41454e; --mute:#7b8089;
  --paper:#f7f5f0; --card:#fff; --line:#ddd8cd;
  --navy:#1b3a5c; --red:#c8102e; --green:#1f7a4d; --amber:#fff6dd; --amber-line:#e0b93a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans SC","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

/* language bar */
.langbar{position:sticky;top:0;z-index:20;background:var(--ink);padding:calc(6px + env(safe-area-inset-top)) 0 6px}
.langs{display:flex;gap:4px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.langs button{flex:0 0 auto;padding:7px 12px;font-size:13px;font-weight:700;border:0;border-radius:2px;
  background:transparent;color:#9aa0aa;font-family:inherit;white-space:nowrap}
.langs button[aria-pressed=true]{background:var(--paper);color:var(--ink)}

/* hero */
header{background:var(--ink);color:#f2efe8;padding:22px 0 30px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;
  background:repeating-linear-gradient(90deg,var(--red) 0 14px,transparent 14px 28px,#f2efe8 28px 42px,transparent 42px 56px)}
.kicker{font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--red)}
h1{font-size:29px;line-height:1.25;letter-spacing:-.02em;margin:8px 0 10px;font-weight:800}
.lede{font-size:15.5px;color:#c3c8d0;margin:0}

/* blocks */
section{margin-top:26px}
h2{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--mute);margin:0 0 12px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 17px}
.card + .card{margin-top:10px}

.step{display:flex;gap:14px;align-items:flex-start}
.step + .step{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.stepno{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.step h3{font-size:16px;margin:2px 0 3px;font-weight:700}
.step p{margin:0;font-size:14.5px;color:var(--ink2)}

table{width:100%;border-collapse:collapse;font-size:14.5px}
td{padding:9px 0;border-bottom:1px solid #eeeae1;vertical-align:top}
tr:last-child td{border-bottom:0}
td.r{text-align:right;white-space:nowrap;font-weight:700}
.small{font-size:12.5px;color:var(--mute);line-height:1.6}

.warn{background:var(--amber);border:1px solid var(--amber-line);border-radius:4px;padding:15px 16px}
.warn h3{margin:0 0 7px;font-size:15.5px;color:#6b5300;font-weight:800}
.warn p{margin:0;font-size:14px;color:#6b5300}

.no{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.no span{font-size:13px;background:#fbe9e9;color:#8f1420;border:1px solid #f0c9cd;
  padding:4px 9px;border-radius:2px;font-weight:600}

/* form */
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
select,input[type=number]{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);
  border-radius:3px;background:#fcfbf8;color:var(--ink);font-family:inherit}
input[type=number]{font-family:ui-monospace,Menlo,monospace;text-align:right}
select:focus,input:focus{outline:2px solid var(--navy);outline-offset:-1px;background:#fff}
.est{margin-top:15px;background:var(--ink);color:#fff;border-radius:4px;padding:14px 15px}
.est .lbl{font-size:11px;letter-spacing:.14em;color:#9aa0aa;font-weight:700}
.est .v{font-size:27px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.est .sub{font-size:12.5px;color:#9aa0aa;margin-top:4px;line-height:1.55}

.btn{display:block;width:100%;text-align:center;text-decoration:none;padding:15px;
  border-radius:3px;font-weight:800;font-size:16px;margin-top:9px;border:0;font-family:inherit}
.btn.line{background:#06c755;color:#fff}
.btn.wa{background:#25d366;color:#fff}
.btn.mail{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}

footer{margin-top:34px;background:var(--ink);color:#8d939c;padding:22px 0 calc(26px + env(safe-area-inset-bottom));font-size:12.5px;line-height:1.7}
footer b{color:#e7e3da}
[data-i18n]{}
</style>
</head>
<body>

<div class="langbar">
  <div class="wrap">
    <div class="langs" id="langs">
      <button data-lang="en" aria-pressed="true">English</button>
      <button data-lang="zh-Hant" aria-pressed="false">繁體中文</button>
      <button data-lang="zh-Hans" aria-pressed="false">简体中文</button>
      <button data-lang="ko" aria-pressed="false">한국어</button>
      <button data-lang="ja" aria-pressed="false">日本語</button>
    </div>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="kicker">AKIHABARA · TOKYO</div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
  </div>
</header>

<div class="wrap">

  <section>
    <h2 data-i18n="how_h"></h2>
    <div class="card">
      <div class="step"><div class="stepno">1</div><div>
        <h3 data-i18n="s1t"></h3><p data-i18n="s1b"></p></div></div>
      <div class="step"><div class="stepno">2</div><div>
        <h3 data-i18n="s2t"></h3><p data-i18n="s2b"></p></div></div>
      <div class="step"><div class="stepno">3</div><div>
        <h3 data-i18n="s3t"></h3><p data-i18n="s3b"></p></div></div>
      <div class="step"><div class="stepno">4</div><div>
        <h3 data-i18n="s4t"></h3><p data-i18n="s4b"></p></div></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="why_h"></h2>
    <div class="card">
      <table>
        <tr><td data-i18n="w1"></td></tr>
        <tr><td data-i18n="w2"></td></tr>
        <tr><td data-i18n="w3"></td></tr>
        <tr><td data-i18n="w4"></td></tr>
      </table>
    </div>
  </section>

  <section>
    <h2 data-i18n="quote_h"></h2>
    <div class="card">
      <label class="f" data-i18n="q_dest"></label>
      <select id="dest">
        <option value="4">United States</option>
        <option value="3">Europe / Canada / Australia</option>
        <option value="2">Asia (SE Asia, India, etc.)</option>
        <option value="1">Taiwan / Hong Kong / Korea / China</option>
      </select>

      <label class="f" data-i18n="q_weight"></label>
      <select id="wt">
        <option value="500">～0.5 kg</option>
        <option value="1000" selected>～1 kg</option>
        <option value="2000">～2 kg</option>
        <option value="3000">～3 kg</option>
        <option value="5000">～5 kg</option>
      </select>

      <label class="f" data-i18n="q_days"></label>
      <select id="days">
        <option value="0" selected>0</option>
        <option value="3">3</option>
        <option value="7">7</option>
        <option value="14">14</option>
      </select>

      <div class="est">
        <div class="lbl" data-i18n="q_est"></div>
        <div class="v num" id="estVal">—</div>
        <div class="sub" id="estSub"></div>
      </div>

      <a class="btn wa" id="btnWa" href="#" data-i18n="btn_wa"></a>
      <a class="btn line" id="btnLine" href="#" data-i18n="btn_line"></a>
      <a class="btn mail" id="btnMail" href="#" data-i18n="btn_mail"></a>
      <p class="small" style="margin-top:12px" data-i18n="q_note"></p>
    </div>
  </section>

  <section>
    <h2 data-i18n="tax_h"></h2>
    <div class="warn">
      <h3 data-i18n="tax_t"></h3>
      <p data-i18n="tax_b"></p>
    </div>
  </section>

  <section>
    <h2 data-i18n="cant_h"></h2>
    <div class="card">
      <p class="small" style="margin:0 0 10px" data-i18n="cant_b"></p>
      <div class="no" id="noList"></div>
    </div>
  </section>

</div>

<footer>
  <div class="wrap">
    <div style="margin-bottom:8px"><b id="bizName">Ocean Trading Co., Ltd.</b></div>
    <div data-i18n="foot"></div>
  </div>
</footer>

var $=function(id){return document.getElementById(id);};
var lang="en";

function applyLang(L){
  lang=L;
  var t=I18N[L];
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k=el.getAttribute("data-i18n");
    if(t[k]!==undefined) el.innerHTML=t[k];
  });
  $("noList").innerHTML = t.no.map(function(x){return "<span>"+x+"</span>";}).join("");
  $("bizName").textContent = CONFIG.bizName;
  document.querySelectorAll("#langs button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-lang")===L);
  });
  calc();
}

document.querySelectorAll("#langs button").forEach(function(b){
  b.onclick=function(){ applyLang(b.getAttribute("data-lang")); window.scrollTo(0,0); };
});

function postage(zone, wt){
  var p=CONFIG.post[zone][wt];
  if(p) return {yen:p, svc:"Air Packet"};
  var e=CONFIG.ems[zone] && CONFIG.ems[zone][wt];
  return e? {yen:e, svc:"EMS"} : null;
}

function calc(){
  var zone=+$("dest").value, wt=+$("wt").value, days=+$("days").value;
  var po=postage(zone,wt);
  var storage = Math.max(0, days-CONFIG.freeDays)*CONFIG.perDay;
  if(!po){ $("estVal").textContent="—"; return; }
  var total = CONFIG.handling + storage + po.yen;
  $("estVal").textContent = "¥"+total.toLocaleString();
  var parts = [
    "Handling ¥"+CONFIG.handling.toLocaleString(),
    po.svc+" ¥"+po.yen.toLocaleString(),
    storage>0 ? "Storage ¥"+storage.toLocaleString()+" ("+(days-CONFIG.freeDays)+"d)"
              : "Storage free ("+CONFIG.freeDays+"d incl.)"
  ];
  $("estSub").textContent = parts.join("  ·  ");
  buildLinks(total, po);
}

function buildLinks(total, po){
  var destTxt=$("dest").options[$("dest").selectedIndex].text;
  var wtTxt=$("wt").options[$("wt").selectedIndex].text;
  var days=$("days").value;
  var msg = "Hello! I'd like a quote.\n"
          + "Destination: "+destTxt+"\n"
          + "Weight: "+wtTxt+"\n"
          + "Hold for: "+days+" days\n"
          + "Estimate shown: ¥"+total.toLocaleString()+" ("+po.svc+")";
  var enc=encodeURIComponent(msg);
  $("btnWa").href  = "https://wa.me/"+CONFIG.whatsapp+"?text="+enc;
  $("btnLine").href= "https://line.me/R/ti/p/@"+CONFIG.lineId;
  $("btnMail").href= "mailto:"+CONFIG.email+"?subject="+encodeURIComponent("Shipping quote request")+"&body="+enc;
}

["dest","wt","days"].forEach(function(id){ $(id).addEventListener("change", calc); });

/* 端末の言語で初期表示を切り替え */
(function(){
  var n=(navigator.language||"en").toLowerCase();
  var pick="en";
  if(n.indexOf("zh")===0) pick = (n.indexOf("cn")>-1||n.indexOf("hans")>-1) ? "zh-Hans" : "zh-Hant";
  else if(n.indexOf("ko")===0) pick="ko";
  else if(n.indexOf("ja")===0) pick="ja";
  applyLang(pick);
})();
</script>
